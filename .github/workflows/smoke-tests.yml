name: Smoke Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: Study_Notes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore StudyNotesPlatform.csproj

      - name: Run smoke tests
        run: dotnet run --project tests/StudyNotesPlatform.SmokeTests/StudyNotesPlatform.SmokeTests.csproj -- --base-url http://127.0.0.1:5187 --startup-timeout-seconds 120
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=Study_Notes;Username=postgres;Password=123
          Jwt__Key: YourSecretKeyHereMakeItAtLeast32CharactersLong!
          Jwt__Issuer: StudyNotesPlatform
          Jwt__Audience: StudyNotesUsers
